# ==============================================================================
# LiveRoomDemo 服务端配置
#
# 所有涉及账号密码的项都写成 ${环境变量:默认值}，默认值一律是本地开发用的占位值。
# 真实密码请通过环境变量注入，不要写回这个文件、更不要提交到仓库。
# 完整的配置项说明见 docs/CONFIGURATION.md。
# ==============================================================================

# ------------------------------------------------------------------------------
# 应用
# ------------------------------------------------------------------------------
server.port=${SERVER_PORT:8085}
# 前端把接口前缀写死成 /LiveDemo，内嵌容器启动时必须用同样的 context-path，
# 否则前端所有请求都会 404。打成 war 部署到外部 Tomcat 时，由 war 包名决定路径。
server.context-path=${SERVER_CONTEXT_PATH:/LiveDemo}

# ------------------------------------------------------------------------------
# MySQL
# 注意：这是 .properties 文件，URL 里的分隔符就写 & ，不要写成 XML 转义的 &amp;
# （原文件写的是 &amp;useSSL=false，Connector/J 会把 "amp;useSSL" 当成一个未知参数）。
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:livedemo}?characterEncoding=utf8&useSSL=false
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# 表结构由 docs/sql/schema.sql 建好，不允许 Hibernate 自动改表结构
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Redis
# ------------------------------------------------------------------------------
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
# 单位毫秒。原来写的是 0（永不超时），Redis 卡住时会把请求线程一起拖死。
spring.redis.timeout=${REDIS_TIMEOUT:2000}
spring.redis.pool.max-active=8
spring.redis.pool.max-wait=-1
spring.redis.pool.max-idle=8
spring.redis.pool.min-idle=0

# ------------------------------------------------------------------------------
# Thymeleaf
# ------------------------------------------------------------------------------
# 页面里有非闭合标签，需要 nekohtml 的宽松模式解析
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# ------------------------------------------------------------------------------
# STOMP 消息代理
#
# relay-enabled=true 时走外部 RabbitMQ（需要开启 rabbitmq_stomp 插件，默认端口 61613）。
# 不想装 RabbitMQ 就设成 false，退化成 Spring 内置的内存代理，单机 demo 完全够用。
# ------------------------------------------------------------------------------
liveroom.broker.relay-enabled=${BROKER_RELAY_ENABLED:true}
liveroom.broker.relay-host=${BROKER_HOST:127.0.0.1}
liveroom.broker.relay-port=${BROKER_PORT:61613}
liveroom.broker.username=${BROKER_USERNAME:guest}
liveroom.broker.password=${BROKER_PASSWORD:guest}

# ------------------------------------------------------------------------------
# 跨域 / WebSocket 来源白名单（逗号分隔）
#
# 原来 CORS 和 SockJS 端点都开了 "*"。本项目用 session 认身份，配合 allowCredentials
# 等于允许任意站点带着用户 Cookie 调本站接口，所以必须收敛成白名单。
# 部署到线上时改成你自己的域名，例如 https://live.example.com
# ------------------------------------------------------------------------------
liveroom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# ------------------------------------------------------------------------------
# 直播流地址
#
# 原来这些地址（包括作者服务器的公网 IP 和域名）是写死在页面里的。留空则页面不初始化
# 播放器，聊天室和弹幕依然可用。搭建推流服务见 docs/DEPLOYMENT.md 的 nginx-rtmp 章节。
#
# 提醒：rtmp 播放依赖 Flash，现代浏览器已全面移除 Flash，桌面端 rtmp 拉流实际上
# 已经播不出来了。想在浏览器里看直播请配置 hls-url（m3u8）。
# ------------------------------------------------------------------------------
# 桌面端默认拉取的 rtmp 地址，例如 rtmp://your-host/live/demo
liveroom.stream.rtmp-url=${STREAM_RTMP_URL:}
# 移动端拉取的 hls 地址，例如 http://your-host/hls/demo.m3u8
liveroom.stream.hls-url=${STREAM_HLS_URL:}
# 推流地址，提示用户用 OBS 等软件推到这里，例如 rtmp://your-host/live/demo
liveroom.stream.publish-url=${STREAM_PUBLISH_URL:}

# ------------------------------------------------------------------------------
# 业务参数
# ------------------------------------------------------------------------------
# Redis 里保留的访客历史条数上限
liveroom.stat.max-guest-history=${MAX_GUEST_HISTORY:2000}
# 单条聊天消息的最大字数，超出部分会被截断
liveroom.chat.max-message-length=${MAX_MESSAGE_LENGTH:200}
# 是否信任 X-Forwarded-For 等反向代理头部。
# 只有确认应用跑在会覆写这些头部的可信代理（Nginx 等）后面时才能打开，
# 否则任何人都能伪造 IP，而本项目正是拿 IP 当访客身份的。
liveroom.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}

# ------------------------------------------------------------------------------
# Actuator
#
# 这个版本的 Spring Boot 在 classpath 没有 Spring Security 时，actuator 端点是完全公开的，
# /env、/configprops 会把数据库密码等环境变量直接打印出来。这里默认全部关闭，
# 只留 health 和 info，并挪到 /manage 下面。
# ------------------------------------------------------------------------------
endpoints.enabled=false
endpoints.health.enabled=true
endpoints.health.sensitive=false
endpoints.info.enabled=true
management.context-path=/manage

# ------------------------------------------------------------------------------
# 日志
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.liveroom=${LOG_LEVEL:INFO}
